[project]
name = "warroom"
description = "War Room — locally run fantasy football draft companion"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "pydantic-settings",
    "sse-starlette",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "backend/warroom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/warroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
